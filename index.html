<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~ Splatoon 2 ~ Off The Hook</title>
    <link rel="stylesheet" href="style.css">

  
    <style>
        html {
            scroll-behavior: smooth;
        }

        html, body {
            background: linear-gradient(180deg, #0a0518 0%, #0d0824 50%, #080314 100%) !important;
            color: #f0e6ff;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

    
        .page-neon-frame {
            position: relative;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            border: 8px solid transparent;
            border-image: linear-gradient(to right, #00f3ff 0%, #00d8ff 35%, #ff007f 65%, #ff1493 100%) 1;
            background: transparent;
            box-shadow: 
                -25px 0 60px rgba(0, 243, 255, 0.6),
                 25px 0 60px rgba(255, 20, 147, 0.6),
                inset -20px 0 50px rgba(0, 243, 255, 0.3),
                inset  20px 0 50px rgba(255, 20, 147, 0.3);
            animation: concertBreathing 4s infinite ease-in-out;
        }

        @keyframes concertBreathing {
            0%, 100% {
                box-shadow: 
                    -15px 0 40px rgba(0, 243, 255, 0.45),
                     15px 0 40px rgba(255, 20, 147, 0.45),
                    inset -10px 0 30px rgba(0, 243, 255, 0.2),
                    inset  10px 0 30px rgba(255, 20, 147, 0.2);
            }
            50% {
                box-shadow: 
                    -35px 0 90px rgba(0, 243, 255, 0.85),
                     35px 0 90px rgba(255, 20, 147, 0.85),
                    inset -25px 0 70px rgba(0, 243, 255, 0.5),
                    inset  25px 0 70px rgba(255, 20, 147, 0.5);
            }
        }

     
        .concert-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .fire-particle {
            position: absolute;
            bottom: -20px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            filter: blur(2px);
            animation: fireFloat 3.5s infinite linear;
        }

        .fire-particle.aqua {
            background: #00f3ff;
            box-shadow: 0 0 12px #00f3ff, 0 0 24px #00d8ff;
        }

        .fire-particle.pink {
            background: #ff1493;
            box-shadow: 0 0 12px #ff1493, 0 0 24px #ff007f;
        }

        @keyframes fireFloat {
            0% { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-105vh) translateX(30px) scale(1.6); opacity: 0; }
        }

        .fp1 { left: 4%; animation-delay: 0s; animation-duration: 3.2s; }
        .fp2 { left: 12%; animation-delay: 1.2s; animation-duration: 4s; }
        .fp3 { left: 22%; animation-delay: 0.5s; animation-duration: 3.5s; }
        .fp4 { left: 35%; animation-delay: 2s; animation-duration: 3.8s; }
        .fp5 { right: 4%; animation-delay: 0.8s; animation-duration: 3.4s; }
        .fp6 { right: 12%; animation-delay: 1.8s; animation-duration: 4.2s; }
        .fp7 { right: 22%; animation-delay: 0.3s; animation-duration: 3.6s; }
        .fp8 { right: 35%; animation-delay: 1.5s; animation-duration: 3.9s; }

        .content-wrap {
            padding: 30px 40px;
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
        }

      
        p.text-body {
            font-family: fantasy, sans-serif;
            font-size: 28px;
            line-height: 1.6;
            text-align: justify;
            color: #d6aaff;
            text-shadow: 0 0 10px rgba(180, 100, 255, 0.3);
        }

        .highlight-aqua {
            color: #00f3ff;
            font-size: 36px;
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
        }

        .highlight-pink {
            color: #ff007f;
            font-size: 36px;
            text-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
        }

 
        .img-card {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
        }

        .img-card:hover {
            transform: scale(1.02);
        }


        .flex-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 35px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .flex-block span, .flex-block p {
            flex: 1;
            min-width: 300px;
        }

        audio {
            outline: none;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), 0 0 15px rgba(255, 0, 127, 0.4);
            margin: 15px 0;
            transition: box-shadow 0.3s ease;
        }



</b>



</div>
</div>

</body>
</html>
